name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          set -e
          n=$(ls -1 *.zip 2>/dev/null | wc -l)
          if [ "$n" -ne 1 ]; then echo "Expected exactly one zip, found $n"; exit 1; fi
          unzip -q *.zip -d _site
          test -f _site/index.html
          touch _site/.nojekyll
      - name: Publish to gh-pages
        run: |
          set -e
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          
